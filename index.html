<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Ekstrakurikuler Sekolah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="form-card">
      <header class="form-header">
        <h1>Formulir Pendaftaran</h1>
        <p>Ekstrakurikuler Sekolah Tahun Ajaran 2026/2027</p>
      </header>

      <form id="registerForm" novalidate>
        <!-- Nama Lengkap -->
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap (min. 3 karakter)">
          <small class="error-msg"></small>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="contoh@sekolah.sch.id">
          <small class="error-msg"></small>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Minimal 8 karakter">
          <small class="error-msg"></small>
        </div>

        <!-- Konfirmasi Password -->
        <div class="form-group">
          <label for="confirmPassword">Konfirmasi Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Ulangi password">
          <small class="error-msg"></small>
        </div>

        <!-- Pilihan Ekstrakurikuler -->
        <div class="form-group">
          <label for="ekskul">Pilihan Ekstrakurikuler</label>
          <select id="ekskul" name="ekskul">
            <option value="">-- Pilih Ekstrakurikuler --</option>
            <option value="Pramuka">Pramuka</option>
            <option value="Paskibra">Paskibra</option>
            <option value="PMR">Palang Merah Remaja (PMR)</option>
            <option value="IT Club">IT Club & Coding</option>
            <option value="Futsal">Futsal</option>
            <option value="Basket">Basket</option>
          </select>
          <small class="error-msg"></small>
        </div>

        <!-- Tombol Submit -->
        <button type="submit" class="btn-submit">Daftar Sekarang</button>

        <!-- Pesan Sukses -->
        <div id="successMessage" class="success-box hidden"></div>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
